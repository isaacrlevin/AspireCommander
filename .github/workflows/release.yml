name: Release

# Every commit pushed to main builds, packs, publishes to NuGet and creates a GitHub release.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # lets the job request an OIDC token for NuGet trusted publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ format('0.2.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview # remove once .NET 11 is GA

      - name: Build
        run: dotnet build src/AspireCommander.sln -c Release -p:Version=${{ env.VERSION }}

      - name: Pack
        run: dotnet pack src/AspireCommander.Hosting/AspireCommander.Hosting.csproj -c Release --no-build -p:Version=${{ env.VERSION }} -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      # Exchanges the workflow's OIDC token for a short-lived NuGet API key (no stored secret).
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ env.VERSION }}" artifacts/*.nupkg
          --target "${{ github.sha }}"
          --title "v${{ env.VERSION }}"
          --generate-notes
